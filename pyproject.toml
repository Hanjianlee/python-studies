[tool.poetry]
name = "python-studies"
version = "0.1.0"
description = "Studies on python features ~"
authors = ["hanjianlee <hanjianlee7@gmail.com>"]
readme = "README.md"

[[tool.poetry.packages]]
# Subproject 1
include = "xlsx-generation"

[tool.poetry.scripts]
xlsx-generation = "xlsx-generation.main:main"

[tool.poetry.dependencies]
python = "^3.11"
openpyxl = "^3.1.2"
memory-profiler = "^0.61.0"
torch = "^2.0.1"
torchviz = "^0.0.2"
matplotlib = "^3.8.0"
torchvision = "^0.15.2"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
